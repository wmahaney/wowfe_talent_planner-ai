# Builds the engine, runs the tests and publishes site/ to GitHub Pages.
#
# One-time setup (the workflow cannot do this itself; the token it runs with
# is not allowed to turn Pages on):
#   repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Pull requests get the build and tests only; pushes to main also deploy.
name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the WebAssembly toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build and test
        run: make all test
      - name: Check that GitHub Pages is turned on
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type > pages_type.txt 2>/dev/null; then
            echo "::error title=GitHub Pages is not turned on::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages, set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
          if [ "$(cat pages_type.txt)" != "workflow" ]; then
            echo "::error title=GitHub Pages is set to deploy from a branch::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages, change Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
